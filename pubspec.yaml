
name: proyecto_final_moviles
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_database: ^13.1.0
  firebase_storage: ^14.1.0
  google_sign_in: ^7.2.0
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.18.3
  cloud_functions: ^7.1.0
  http: ^1.6.0
  image_picker: ^1.2.4
  http_parser: ^4.1.2
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.3
  mobile_scanner: ^7.5.0
  flutter_cache_manager: ^3.5.0
  google_maps_flutter: ^2.19.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic
